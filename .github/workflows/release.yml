name: Release

# Tag-triggered release pipeline. Reruns every validation check, builds
# both macOS architectures ad-hoc signed, and ONLY publishes a GitHub
# Release if every job succeeds - a failure anywhere leaves no partial
# Release behind.
on:
  push:
    tags: ["v*"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/check-versions.sh
      - run: npm test
      - run: npm run check
      - run: npm run format:check
      - run: npm run build

  validate-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  validate-scripts:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          brew install shellcheck
          shellcheck install.sh uninstall.sh scripts/check-versions.sh tests/scripts/*.sh
      - run: bash -n install.sh && bash -n uninstall.sh
      - run: bash tests/scripts/test-install.sh
      - run: bash tests/scripts/test-uninstall.sh

  # Both targets are cross-compiled from a single arm64 (macos-14) runner:
  # GitHub has retired free/standard Intel macOS runners (macos-13 no
  # longer exists; the remaining x64 labels are paid per-minute "larger
  # runners"). Rust's macOS toolchain cross-compiles to x86_64-apple-darwin
  # from an arm64 host natively, and `codesign` can ad-hoc sign a
  # foreign-arch binary fine, so this needs no paid runner. This does NOT
  # verify the x86_64 binary actually RUNS - only that it builds, is
  # correctly ad-hoc signed, and reports the right architecture.
  build:
    needs: [validate, validate-rust, validate-scripts]
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_name: aarch64
          - target: x86_64-apple-darwin
            arch_name: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci
      - run: bash scripts/check-versions.sh

      - name: Confirm tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -pe "require('./package.json').version")"
          if [[ "$TAG" != "$PKG" ]]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Build (ad-hoc signed)
        run: npx tauri build --target ${{ matrix.target }} --bundles app
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Locate built bundle
        id: bundle
        run: |
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Remi.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Expected bundle not found at $APP_PATH" >&2
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify ad-hoc signature
        run: codesign --verify --deep --strict "${{ steps.bundle.outputs.app_path }}"

      - name: Verify architecture
        run: |
          BIN="${{ steps.bundle.outputs.app_path }}/Contents/MacOS/remi"
          file "$BIN"
          file "$BIN" | grep -q "${{ matrix.arch_name }}" || {
            echo "Binary architecture does not match ${{ matrix.arch_name }}" >&2
            exit 1
          }

      - name: Package archive
        id: package
        run: |
          VERSION="$(node -pe "require('./package.json').version")"
          ASSET_NAME="Remi-${VERSION}-macos-${{ matrix.arch_name }}.tar.gz"
          tar -C "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -czf "$ASSET_NAME" Remi.app
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.arch_name }}
          path: ${{ steps.package.outputs.asset_name }}
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          pattern: release-asset-*
          merge-multiple: true
          path: dist-release

      - name: Generate checksums
        working-directory: dist-release
        run: sha256sum *.tar.gz > checksums.txt

      - name: List release contents
        run: ls -la dist-release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.tar.gz
            dist-release/checksums.txt
          generate_release_notes: true
          draft: false
