#############################################################################
# The Rust crate for Remi. main.rs, tauri.conf.json, build.rs and
# src/ all live in this src-tauri/ folder, the conventional Tauri layout.
#############################################################################

[package]
name = "remi"
version = "0.1.0"
edition = "2021"
description = "Remi tray popover app"

# ONE binary, no library target. Unit tests live beside the modules they
# test, so a single bin target is enough.
[[bin]]
name = "remi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Windows-only: a true single-step atomic file replace (MoveFileExW). The
# naive remove-then-rename would leave a window where the live state file is
# absent.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

# macOS-only: the popover has to draw over ANOTHER app's fullscreen Space.
# That needs an NSPanel with NSWindowStyleMaskNonactivatingPanel (so giving
# it key status does not ACTIVATE Remi and switch the user out of that
# Space), plus .fullScreenAuxiliary collection behaviour and
# NSStatusWindowLevel. Tauri exposes none of the three: its
# `set_visible_on_all_workspaces` sets only .canJoinAllSpaces, and its
# `alwaysOnTop` only reaches NSFloatingWindowLevel. Both crates already
# resolve transitively via tao/tauri, so this adds no new supply-chain
# surface - see `windows::panel`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSWindow",
  "NSPanel",
  "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

# Dependencies deliberately not used:
#   tauri-nspanel   - it is only published as a git dependency pinned to a
#                      branch, and all we need from it is one method
#                      override plus four setters, which `windows::panel`
#                      does directly with the objc2 crates already in tree
#   tauri-plugin-positioner - manual anchoring covers this build
#   semver, reqwest, zip - silent self-update
#   rfd             - native "your data file is corrupt" dialog
#   chrono, uuid    - Date/crypto-free helpers in the frontend cover it
# The `image-png` tauri feature is gone too: the tray mark is drawn in code
# (`tray_image`) rather than decoded from a PNG, so no binary asset is needed.
