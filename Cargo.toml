#############################################################################
# The Rust crate for the MVP packet. Everything lives in ONE folder: this file,
# tauri.conf.json, build.rs and main.rs sit beside the frontend, rather than the
# full repo's app/ + app/src-tauri/ + core/ three-crate split.
#############################################################################

[package]
name = "dopamigo"
version = "0.1.0"
edition = "2021"
description = "Dopamigo tray popover app (minimal MVP packet)"

# ONE binary, no library target. The full repo splits lib/bin so the logic can be
# integration-tested from `tests/`; here the unit tests live inside main.rs, so
# a single bin target is enough.
[[bin]]
name = "dopamigo"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Windows-only: a true single-step atomic file replace (MoveFileExW). The naive
# remove-then-rename would leave a window where the live state file is absent.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

# Dependencies deliberately DROPPED from the full app, and what you lose:
#   dopamigo-core   - the separate engine crate; its model now lives in store.ts
#   tauri-nspanel   - float the popover over ANOTHER app's fullscreen Space
#   tauri-plugin-positioner + objc - manual anchoring covers the MVP
#   semver, reqwest, zip - silent self-update
#   rfd             - native "your data file is corrupt" dialog
#   chrono, uuid    - Date/crypto-free helpers in store.ts cover it
# The `image-png` tauri feature is gone too: the tray mark is drawn in code
# (`tray_image`) rather than decoded from a PNG, so no binary asset is needed.
